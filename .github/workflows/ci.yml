name: Weather training smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install training dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'scikit-learn>=1.5,<2' 'joblib>=1.4,<2'
      - name: Syntax and training smoke
        working-directory: weather_dashboard
        run: |
          python -m py_compile app.py chatbot.py generate_index.py train.py
          python -m unittest discover -s tests -v
